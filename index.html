<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>SpendWise</h1>
    <p>Set a monthly budget, log what you spend, and see where you stand.</p>
  </header>

  <main class="layout">

    <!-- ========== DASHBOARD (filled in by script.js) ========== -->
    <section class="dashboard" aria-labelledby="dash-title">
      <h2 id="dash-title" class="visually-hidden">Dashboard</h2>

      <div class="gauge-card">
        <div class="gauge-figures">
          <div>
            <span class="figure-label">Spent</span>
            <span class="figure" id="total-spent">0.00</span>
          </div>
          <div>
            <span class="figure-label">Remaining</span>
            <span class="figure" id="remaining">0.00</span>
          </div>
          <div>
            <span class="figure-label">Budget</span>
            <span class="figure" id="budget-display">0.00</span>
          </div>
        </div>

        <div class="gauge" role="img" aria-label="Budget used" id="gauge">
          <div class="gauge-fill" id="gauge-fill"></div>
          <span class="tick" style="left:50%"></span>
          <span class="tick" style="left:80%"></span>
        </div>
        <div class="gauge-scale"><span>0%</span><span>50%</span><span>80%</span><span>100%</span></div>

        <p class="status" id="status-message" role="status" aria-live="polite"></p>
        <p class="tip" id="tip-message"></p>
      </div>

      <div class="panel">
        <h3>Where the money goes</h3>
        <ul class="category-list" id="category-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Expenses</h3>
          <div class="panel-tools">
            <label for="filter-category" class="visually-hidden">Filter by category</label>
            <select id="filter-category"></select>
            <button type="button" class="btn-quiet" id="clear-all">Clear all</button>
          </div>
        </div>
        <p class="list-summary" id="list-summary"></p>
        <ul class="expense-list" id="expense-list"></ul>
      </div>
    </section>

    <!-- ========== FORMS ========== -->
    <aside class="controls">
      <form id="budget-form" class="panel" novalidate>
        <h3>Monthly budget</h3>
        <label for="budget-input">Amount</label>
        <div class="inline-field">
          <input type="number" id="budget-input" min="1" step="0.01" placeholder="e.g. 1000" inputmode="decimal">
          <button type="submit" class="btn-secondary">Set budget</button>
        </div>
        <p class="form-error" id="budget-error" role="alert"></p>
      </form>

      <form id="expense-form" class="panel" novalidate>
        <h3>Add an expense</h3>

        <label for="expense-name">What was it for?</label>
        <input type="text" id="expense-name" maxlength="40" placeholder="e.g. Groceries">

        <label for="expense-amount">Amount</label>
        <input type="number" id="expense-amount" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">

        <label for="expense-category">Category</label>
        <select id="expense-category"></select>

        <label for="expense-date">Date</label>
        <input type="date" id="expense-date">

        <p class="form-error" id="expense-error" role="alert"></p>
        <button type="submit" class="btn-primary">Add expense</button>
      </form>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
